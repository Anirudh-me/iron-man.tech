<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="" />
    <meta name="description" content="" />
    <link rel="icon" type="image/png" />
    <title></title>
    <link rel="stylesheet" href="./assets/index-red.css" />
    <style>
      :root {
        --gfg: #d50022;
        --ink: #120306;
      }

      body {
        background: #0a0a0a;
        margin: 0;
      }

      .boot {
        z-index: 100;
        color: #ff6876;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        background: #0a0a0a;
        place-items: center;
        font:
          600 12px/1 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        display: grid;
        position: fixed;
        inset: 0;
      }

      .boot span:after {
        content: "";
        transform-origin: 0;
        background: currentColor;
        height: 2px;
        margin-top: 16px;
        animation: 1.1s ease-in-out infinite alternate boot;
        display: block;
      }

      @keyframes boot {
        0% {
          transform: scaleX(0.1);
        }
        to {
          transform: scaleX(1);
        }
      }
    </style>
    <script type="module" src="./assets/index-red.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
